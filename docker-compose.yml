services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: courtsplit
      MYSQL_DATABASE: courtsplit
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pcourtsplit"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://root:courtsplit@db:3306/courtsplit
      # OAuth credentials for your identity provider go here:
      APP_ID: ${APP_ID:-}
      APP_SECRET: ${APP_SECRET:-}
      VITE_APP_ID: ${VITE_APP_ID:-}
      VITE_KIMI_AUTH_URL: ${VITE_KIMI_AUTH_URL:-}
      KIMI_AUTH_URL: ${KIMI_AUTH_URL:-}
      KIMI_OPEN_URL: ${KIMI_OPEN_URL:-}
      OWNER_UNION_ID: ${OWNER_UNION_ID:-}
    ports:
      - "3000:3000"

volumes:
  db_data:
